<!DOCTYPE HTML>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="Author" content="Steve Hansen Smythe">
    <meta name="description" content="Steve Hansen Smythe - Music">
    <meta name="keywords" content="Steve Hansen Smythe, compositions, original music">
    <title>Steve Hansen Smythe - Music</title>
    <link href="../css/shs.css" rel="stylesheet" type="text/css">
    <link href="./css/music.css" rel="stylesheet" type="text/css">
    <script src="./js/music.js" type="module"></script>
    <script src="../js/init1.js" type="module"></script>
    <div id="header"></div>
</head>

<body>
    <div id="contents">
        <div id="controls">
            <div class="controlItem" id="playerControl">
                <audio controls preload="auto" id="player">
                    <source id="audioMP3" src="" type="audio/mpeg">
                    Your browser does not support this audio player.
                </audio>
                <p id="playerText">For works with audio, listen by clicking the
                    <img src="./images/play.png" width="24" height="24"> button</p>
            </div>
            <div class="controlItem" id="filterControl">
                <p><label for="searchInput">Search for keyword:</label><br><input id="searchInput" type="text" size="20"></p>
                <p><label for="genreSelect">or filter by genre:</label><br><select id="genreSelect" name="genre"></select></p>
            </div>
            <div class="controlItem" id="instrControl">
                <p><label for="instrSelect">or filter by one or more instrument types:</label><br><select multiple id="instrSelect" name="instr" size="4"></select></p>
            </div>
        </div>
        <!-- All the rows in the table except the header row will be replaced -->
        <table id="mainTable">
            <caption>
                This page has been optimized for Javascript-enabled and standards-compliant browsers.
            </caption>
            <tr valign="top">
                <th></th>
                <th>Media</th>
                <th><label id="duration" class="headerLabel">Duration</label></th>
                <th><label id="title" class="headerLabel">Title</label></th>
                <th><label id="year" class="headerLabel">Year</label></th>
            </tr>
        </table>
        <a href="https://stevehansensmythe.musicaneo.com/"><img
                src="https://data.musicaneo.com/promotools/images/buy_my_sheet_music_en.gif"
                alt="Buy my sheet music at MusicaNeo" title="Buy my sheet music at MusicaNeo" /></a>
    </div>
</body>

</HTML>
